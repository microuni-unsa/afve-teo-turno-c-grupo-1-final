name: verify

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DAFNY_VERSION: "4.11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Dafny
        id: cache-dafny
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dafny
          key: dafny-${{ env.DAFNY_VERSION }}-ubuntu-22.04

      - name: Install Dafny
        if: steps.cache-dafny.outputs.cache-hit != 'true'
        run: |
          DAFNY_ARCHIVE="dafny-${DAFNY_VERSION}-x64-ubuntu-22.04.zip"
          curl -sSL "https://github.com/dafny-lang/dafny/releases/download/v${DAFNY_VERSION}/${DAFNY_ARCHIVE}" -o "${{ runner.temp }}/${DAFNY_ARCHIVE}"
          unzip -q "${{ runner.temp }}/${DAFNY_ARCHIVE}" -d "${{ runner.temp }}"
          rm "${{ runner.temp }}/${DAFNY_ARCHIVE}"

      - name: Add Dafny to PATH
        run: echo "${{ runner.temp }}/dafny" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v2

      - name: Toolchain versions
        run: |
          dafny --version
          bun --version

      - name: Dafny verify
        run: dafny verify dafny/Schema.dfy dafny/Syntax.dfy dafny/Eval.dfy dafny/Coherence.dfy dafny/Transition.dfy dafny/BoundedCheck.dfy

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint check
        run: bun run check

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Pack check
        run: bun pm pack

